<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="theme-color" content="#10b981">
<meta name="description" content="Карта безалкогольных баров, кафе, кофеен и лофтов в вашем городе">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Карта безалкогольных заведений для трезвенников. Найдите кафе, бары, лофты и пространства без алкоголя.">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="/manifest.json">
    <title>Трезвая Карта — Заведения без алкоголя</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-map-marker-alt"></i>
            <div>
                <h1>Трезвая Карта</h1>
                <p>Заведения без алкоголя</p>
            </div>
        </div>
        <div class="nav-links" style="display:flex; gap:14px; align-items:center; font-size:0.9rem;">
            <a href="/courses.html" style="color:var(--text-secondary); text-decoration:none;">Спецкурсы</a>
            <a href="/meetups.html" style="color:var(--text-secondary); text-decoration:none;">Слёты трезвости</a>
            <a href="/clubs.html" style="color:var(--text-secondary); text-decoration:none;">Клубы Шичко</a>
        </div>
        <div class="nav-actions">
            <button id="locateBtn" class="btn-icon" title="Найти меня">
                <i class="fas fa-location-arrow"></i>
            </button>
            <button id="openModalBtn" class="btn-primary">
                <i class="fas fa-plus"></i> <span>Добавить</span>
            </button>
        </div>
    </nav>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Поиск по названию или адресу...">
        <button id="clearSearch" class="clear-btn hidden"><i class="fas fa-times"></i></button>
    </div>

    <div class="filters-bar">
        <button class="filter-btn active" data-category="all">
            <i class="fas fa-layer-group"></i> Все <span id="placeCount">0</span>
        </button>
        <button class="filter-btn" data-category="sober-bar">
            <i class="fas fa-glass-water"></i> Безалкогольные бары
        </button>
        <button class="filter-btn" data-category="cafe">
            <i class="fas fa-mug-hot"></i> Кафе
        </button>
        <button class="filter-btn" data-category="coffee">
            <i class="fas fa-coffee"></i> Кофейни
        </button>
        <button class="filter-btn" data-category="restaurant">
            <i class="fas fa-utensils"></i> Рестораны
        </button>
        <button class="filter-btn" data-category="loft">
            <i class="fas fa-building"></i> Лофты
        </button>
        <button class="filter-btn" data-category="activity">
            <i class="fas fa-puzzle-piece"></i> Развлечения
        </button>
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-list"></i> Список заведений</h3>
                <button id="toggleSidebar" class="btn-icon mobile-only">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <div id="placesList" class="places-list">
                <div class="loading-state">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <p>Загрузка заведений...</p>
                </div>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <button id="mobileListBtn" class="mobile-fab mobile-only">
        <i class="fas fa-list"></i> Список
    </button>

    <div id="addModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> Добавить заведение</h3>
                <button id="closeModalBtn" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="addPlaceForm">
                <div class="form-group">
                    <label for="title">Название заведения *</label>
                    <input type="text" id="title" placeholder="Например: Шоколадница" required>
                </div>

                <div class="form-group">
                    <label for="address">Город и адрес *</label>
                    <input type="text" id="address" placeholder="Москва, ул. Арбат 12" required>
                    <small>Координаты определятся автоматически по адресу</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Категория *</label>
                        <select id="category" required>
                            <option value="sober-bar">Безалкогольный бар</option>
                            <option value="cafe">Кафе</option>
                            <option value="coffee">Кофейня</option>
                            <option value="restaurant">Ресторан</option>
                            <option value="loft">Лофт / Пространство</option>
                            <option value="activity">Развлечения / Антикафе</option>
                        </select>
                    </div>
                </div>

                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
                    </div>
                    <div class="form-group">
                        <label for="website">Сайт</label>
                        <input type="url" id="website" placeholder="https://example.ru">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="3" placeholder="Уютное место, отличный кофе, тихая атмосфера..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                    <button type="submit" class="btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
