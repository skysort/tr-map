<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <meta name="description" content="Клубы трезвости Шичко — расписание, адреса, контакты.">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>Клубы Шичко — Трезвая Карта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      body { overflow: auto; height: auto; min-height: 100vh; }
      .page-container { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
      .page-container .places-list { max-height: none; }
    </style>
</head>
<body data-section="clubs">
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-map-marker-alt"></i>
            <div>
                <h1>Трезвая Карта</h1>
                <p>Клубы Шичко</p>
            </div>
        </div>
        <div class="nav-actions">
            <button id="openModalBtn" class="btn-primary">
                <i class="fas fa-plus"></i> <span>Добавить</span>
            </button>
        </div>
    </nav>

    <div class="page-container">
        <p style="margin: 16px 0; color: var(--text-secondary);">
            <a href="/">Карта заведений</a> ·
            <a href="/courses.html">Спецкурсы</a> ·
            <a href="/meetups.html">Слёты трезвости</a> ·
            <a href="/clubs.html"><b>Клубы Шичко</b></a>
        </p>
        <div id="itemsList" class="places-list"></div>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> Добавить клуб Шичко</h3>
                <button id="closeModalBtn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <form id="addItemForm">
                <div class="form-group">
                    <label for="title">Название клуба *</label>
                    <input type="text" id="title" placeholder="Например: Клуб трезвости "Оптималист"" required>
                </div>
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="city">Город</label>
                        <input type="text" id="city" placeholder="Москва">
                    </div>
                    <div class="form-group">
                        <label for="address">Адрес</label>
                        <input type="text" id="address" placeholder="ул. Ленина, 5">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dateText">Расписание</label>
                    <input type="text" id="dateText" placeholder="Встречи по вторникам, 19:00">
                </div>
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
                    </div>
                    <div class="form-group">
                        <label for="website">Сайт / соцсеть</label>
                        <input type="url" id="website" placeholder="https://example.ru">
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="3" placeholder="Формат встреч, кто ведёт, как присоединиться..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                    <button type="submit" class="btn-primary" id="submitBtn"><i class="fas fa-save"></i> Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="section.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    </script>
</body>
</html>
